name: pull

on:
  schedule:
    - cron: "30 23 * * *"   # 01:30 Madrid (verano) / 00:30 (invierno): el dia anterior ya esta cerrado
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pull.py, .github/workflows/pull.yml]   # corre al ajustar parsers

permissions:
  contents: write

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pull de portales
        run: python pull.py
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FC_DAILY_MAX: "0"   # Firecrawl desactivado: quedan pocos creditos
      - name: Resumen
        if: always()
        run: cat data/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit de datos
        if: always()
        run: |
          git config user.name "jobot-bot"
          git config user.email "jobot-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "pull $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push
